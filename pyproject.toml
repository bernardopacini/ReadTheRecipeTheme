[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinxReadTheRecipeTheme"
version = "0.1.0"
description = "Sphinx HTML theme for ReadTheRecipe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Bernardo Pacini", email = "bpacini@umich.edu" }]
dependencies = ["sphinx>=7.2"]
classifiers = [
    "Framework :: Sphinx :: Theme",
    "Topic :: Documentation :: Sphinx",
]

[project.urls]
Homepage = "https://github.com/bernardopacini/ReadTheRecipeTheme"

[project.entry-points."sphinx.html_themes"]
sphinxReadTheRecipeTheme = "sphinxReadTheRecipeTheme"

[tool.setuptools]
packages = ["sphinxReadTheRecipeTheme"]

[tool.setuptools.package-data]
sphinxReadTheRecipeTheme = [
    "theme.conf",
    "*.html",
    "static/**/*",
]
