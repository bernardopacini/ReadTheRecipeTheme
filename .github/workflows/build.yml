name: Build sample docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            sphinx: "sphinx==7.2.*"
          - python-version: "3.13"
            sphinx: "sphinx"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install theme
        run: pip install . "${{ matrix.sphinx }}"
      - name: Build sample docs
        run: sphinx-build -W -b html tests/sample_docs build/html
      - name: Check theme stylesheet is linked
        run: grep -q 'ReadTheRecipe.css' build/html/index.html
